name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, kernel-check, and compare Theorem 1
    runs-on: ubuntu-latest
    # Core.lean is one large file, so the build cannot parallelise much.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Installs the toolchain named in lean-toolchain, runs `lake exe cache get`,
      # and runs `lake build` on the default targets. `lake check` and
      # `lake comparator` reuse this .lake (Mathlib cache and project build);
      # their sandbox has no network during the build, so the cache must be
      # fetched here.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          use-mathlib-cache: true

      # `lake check` and `lake comparator` build inside a bubblewrap sandbox.
      # Ubuntu 24.04 blocks the unprivileged user namespaces bwrap needs;
      # the runner is disposable, so lifting that restriction is safe here.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: lake check (every numbered result, standard axioms only)
        run: lake check

      - name: lake comparator (Theorem 1 against Challenge.lean)
        run: lake comparator
